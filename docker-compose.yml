# Uso local para validar a imagem de produção: docker compose up --build
# O Easypanel NÃO usa este arquivo (builda direto pelo Dockerfile).
# O .env precisa ter SESSION_SECRET, APP_USER (e-mail) e APP_PASSWORD (semeiam o primeiro
# admin) e a migration de usuários já aplicada no Supabase. Ver docs/DEPLOY_EASYPANEL.md.
services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
